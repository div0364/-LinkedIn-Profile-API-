<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Profile Scraper API</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-extrabold text-blue-700 tracking-tight">LinkedIn Profile Scraper</h1>
      <p class="mt-2 text-lg text-gray-600">Reverse engineered LinkedIn profile parser API with caching</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Scrape Request</h2>
        <form id="scrapeForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">LinkedIn Profile URL</label>
            <input 
              type="url" 
              id="profileUrl" 
              required 
              placeholder="https://www.linkedin.com/in/username" 
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            >
          </div>

          <div class="border-t border-gray-100 pt-4">
            <button 
              type="button" 
              id="toggleCookies" 
              class="text-sm font-medium text-blue-600 hover:text-blue-700 focus:outline-none"
            >
              + Advanced Settings (Custom Cookies)
            </button>
            
            <div id="cookieFields" class="hidden mt-3 space-y-3">
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Session Cookie (li_at)</label>
                <input 
                  type="text" 
                  id="liAt" 
                  placeholder="Paste li_at cookie" 
                  class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">CSRF Token (JSESSIONID)</label>
                <input 
                  type="text" 
                  id="jsessionId" 
                  placeholder="Paste JSESSIONID cookie" 
                  class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
              </div>
            </div>
          </div>

          <div class="flex items-center">
            <input 
              type="checkbox" 
              id="forceScrape" 
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
            >
            <label for="forceScrape" class="ml-2 block text-sm text-gray-700">
              Bypass cache (Force fresh scrape)
            </label>
          </div>

          <button 
            type="submit" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          >
            Start Scraping
          </button>
        </form>

        <div id="statusArea" class="hidden mt-6 p-4 rounded-xl bg-blue-50 border border-blue-100 flex items-center space-x-3">
          <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600"></div>
          <span class="text-sm font-semibold text-blue-800" id="statusMessage">Processing request...</span>
        </div>

        <div id="errorArea" class="hidden mt-6 p-4 rounded-xl bg-red-50 border border-red-100 text-sm text-red-700"></div>
      </div>

      <div class="lg:col-span-2 space-y-6">
        <div id="resultPlaceholder" class="bg-white p-12 rounded-2xl shadow-sm border border-gray-100 text-center">
          <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <h3 class="mt-4 text-lg font-bold text-gray-700">No profile data loaded</h3>
          <p class="mt-1 text-gray-500">Fill out the form and click "Start Scraping" to extract details.</p>
        </div>

        <div id="resultContent" class="hidden space-y-6">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex flex-col sm:flex-row items-center sm:items-start space-y-4 sm:space-y-0 sm:space-x-6">
              <img 
                id="resAvatar" 
                src="" 
                alt="Avatar" 
                class="h-24 w-24 rounded-full border border-gray-200 object-cover bg-gray-100"
                onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'"
              >
              <div class="text-center sm:text-left flex-1">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between">
                  <h2 id="resName" class="text-2xl font-extrabold text-gray-900"></h2>
                  <span id="resSource" class="mt-2 sm:mt-0 inline-block px-3 py-1 text-xs font-bold rounded-full"></span>
                </div>
                <p id="resHeadline" class="text-gray-700 mt-1 font-medium"></p>
                <p id="resLocation" class="text-gray-500 mt-2 text-sm flex items-center justify-center sm:justify-start">
                  <svg class="h-4 w-4 mr-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  </svg>
                  <span></span>
                </p>
              </div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-lg font-bold text-gray-800 mb-3 border-b border-gray-50 pb-2">About</h3>
            <p id="resAbout" class="text-gray-700 whitespace-pre-wrap text-sm leading-relaxed"></p>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-50 pb-2">Experience</h3>
            <div id="resExperience" class="space-y-4"></div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-50 pb-2">Education</h3>
            <div id="resEducation" class="space-y-4"></div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
              <h3 class="text-lg font-bold text-gray-800 mb-3 border-b border-gray-50 pb-2">Skills</h3>
              <div id="resSkills" class="flex flex-wrap gap-2 pt-2"></div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
              <h3 class="text-lg font-bold text-gray-800 mb-3 border-b border-gray-50 pb-2">Certifications</h3>
              <div id="resCertifications" class="space-y-2 pt-2"></div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-lg font-bold text-gray-800 mb-3 border-b border-gray-50 pb-2">Languages</h3>
            <div id="resLanguages" class="flex flex-wrap gap-2 pt-2"></div>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-lg font-bold text-gray-800">Raw JSON Output</h3>
              <button 
                id="copyJson" 
                class="text-xs font-semibold text-blue-600 hover:text-blue-700 bg-blue-50 px-3 py-1.5 rounded-lg"
              >
                Copy JSON
              </button>
            </div>
            <pre id="resJson" class="bg-gray-900 text-gray-100 p-4 rounded-xl text-xs overflow-x-auto max-h-96"></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleCookies = document.getElementById('toggleCookies');
    const cookieFields = document.getElementById('cookieFields');
    toggleCookies.addEventListener('click', () => {
      cookieFields.classList.toggle('hidden');
    });

    const scrapeForm = document.getElementById('scrapeForm');
    const resultPlaceholder = document.getElementById('resultPlaceholder');
    const resultContent = document.getElementById('resultContent');
    const statusArea = document.getElementById('statusArea');
    const statusMessage = document.getElementById('statusMessage');
    const errorArea = document.getElementById('errorArea');

    let currentJsonData = null;

    scrapeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const url = document.getElementById('profileUrl').value;
      const liAt = document.getElementById('liAt').value;
      const jsessionId = document.getElementById('jsessionId').value;
      const force = document.getElementById('forceScrape').checked;

      statusArea.classList.remove('hidden');
      errorArea.classList.add('hidden');
      resultPlaceholder.classList.remove('hidden');
      resultContent.classList.add('hidden');

      statusMessage.textContent = 'Launching browser and authenticating...';

      try {
        const bodyData = { url };
        if (liAt) bodyData.liAt = liAt;
        if (jsessionId) bodyData.jsessionId = jsessionId;

        const response = await fetch(`/api/profiles/scrape?force=${force}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyData)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Server error occurred');
        }

        currentJsonData = result.data;
        displayProfile(result);
      } catch (err) {
        errorArea.classList.remove('hidden');
        errorArea.textContent = err.message;
      } finally {
        statusArea.classList.add('hidden');
      }
    });

    function displayProfile(res) {
      const data = res.data;
      resultPlaceholder.classList.add('hidden');
      resultContent.classList.remove('hidden');

      document.getElementById('resAvatar').src = data.profileImage || '';
      document.getElementById('resName').textContent = data.name || 'No Name';
      document.getElementById('resHeadline').textContent = data.headline || '';
      document.getElementById('resLocation').querySelector('span').textContent = data.location || 'No Location';

      const sourceBadge = document.getElementById('resSource');
      sourceBadge.textContent = res.source === 'cache' ? 'Cached' : 'Scraped Live';
      if (res.source === 'cache') {
        sourceBadge.className = 'mt-2 sm:mt-0 inline-block px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800';
      } else {
        sourceBadge.className = 'mt-2 sm:mt-0 inline-block px-3 py-1 text-xs font-bold rounded-full bg-blue-100 text-blue-800';
      }

      document.getElementById('resAbout').textContent = data.about || 'No details provided.';

      const expContainer = document.getElementById('resExperience');
      expContainer.innerHTML = '';
      if (data.experience && data.experience.length > 0) {
        data.experience.forEach(exp => {
          const div = document.createElement('div');
          div.className = 'border-l-2 border-gray-100 pl-4 relative py-1';
          div.innerHTML = `
            <div class="absolute w-3 h-3 bg-blue-500 rounded-full -left-[7px] top-3"></div>
            <h4 class="font-bold text-gray-800">${exp.title || 'Role'}</h4>
            <p class="text-sm font-semibold text-gray-600">${exp.company || 'Company'}</p>
            <p class="text-xs text-gray-400 mt-0.5">${exp.duration || ''}</p>
            ${exp.description ? `<p class="text-xs text-gray-600 mt-2 bg-gray-50 p-2.5 rounded-lg">${exp.description}</p>` : ''}
          `;
          expContainer.appendChild(div);
        });
      } else {
        expContainer.innerHTML = '<p class="text-sm text-gray-500">No experience records found.</p>';
      }

      const eduContainer = document.getElementById('resEducation');
      eduContainer.innerHTML = '';
      if (data.education && data.education.length > 0) {
        data.education.forEach(edu => {
          const div = document.createElement('div');
          div.className = 'border-l-2 border-gray-100 pl-4 relative py-1';
          div.innerHTML = `
            <div class="absolute w-3 h-3 bg-gray-400 rounded-full -left-[7px] top-3"></div>
            <h4 class="font-bold text-gray-800">${edu.school || 'School'}</h4>
            <p class="text-sm text-gray-600">${edu.degree || ''}</p>
            <p class="text-xs text-gray-400 mt-0.5">${edu.dates || ''}</p>
          `;
          eduContainer.appendChild(div);
        });
      } else {
        eduContainer.innerHTML = '<p class="text-sm text-gray-500">No education records found.</p>';
      }

      const skillsContainer = document.getElementById('resSkills');
      skillsContainer.innerHTML = '';
      if (data.skills && data.skills.length > 0) {
        data.skills.forEach(skill => {
          const span = document.createElement('span');
          span.className = 'bg-gray-100 text-gray-700 text-xs font-semibold px-3 py-1 rounded-full';
          span.textContent = skill;
          skillsContainer.appendChild(span);
        });
      } else {
        skillsContainer.innerHTML = '<p class="text-sm text-gray-500">No skills found.</p>';
      }

      const certContainer = document.getElementById('resCertifications');
      certContainer.innerHTML = '';
      if (data.certifications && data.certifications.length > 0) {
        data.certifications.forEach(cert => {
          const div = document.createElement('div');
          div.className = 'text-sm text-gray-700 bg-gray-50 p-2.5 rounded-xl border border-gray-100';
          div.textContent = cert;
          certContainer.appendChild(div);
        });
      } else {
        certContainer.innerHTML = '<p class="text-sm text-gray-500">No certifications found.</p>';
      }

      const langContainer = document.getElementById('resLanguages');
      langContainer.innerHTML = '';
      if (data.languages && data.languages.length > 0) {
        data.languages.forEach(lang => {
          const span = document.createElement('span');
          span.className = 'bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full';
          span.textContent = lang;
          langContainer.appendChild(span);
        });
      } else {
        langContainer.innerHTML = '<p class="text-sm text-gray-500">No languages found.</p>';
      }

      document.getElementById('resJson').textContent = JSON.stringify(data, null, 2);
    }

    document.getElementById('copyJson').addEventListener('click', () => {
      if (currentJsonData) {
        navigator.clipboard.writeText(JSON.stringify(currentJsonData, null, 2));
        const btn = document.getElementById('copyJson');
        btn.textContent = 'Copied!';
        setTimeout(() => {
          btn.textContent = 'Copy JSON';
        }, 2000);
      }
    });
  </script>
</body>
</html>
